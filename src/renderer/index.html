<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' dukread:; script-src 'self' dukread: 'wasm-unsafe-eval'; style-src 'self' dukread: 'unsafe-inline'; img-src 'self' dukread: data: blob:; font-src 'self' dukread: data: blob:; worker-src 'self' dukread: blob:; connect-src 'self' dukread:">
  <title>DukRead</title>
  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <button id="toggle-left" class="tool"></button>
    <div id="book-title"></div>
    <div id="page-box">
      <input id="page-input" type="text" inputmode="numeric" autocomplete="off">
      <span id="page-total"></span>
    </div>
    <div id="zoom-box">
      <button id="zoom-out" class="tool"></button>
      <button id="zoom-level" class="tool text"></button>
      <button id="zoom-in" class="tool"></button>
    </div>
    <button id="toggle-right" class="tool"></button>
  </header>
  <main id="main">
    <aside id="left" class="column">
      <nav class="tabs" id="left-tabs"></nav>
      <div class="column-body" id="left-body"></div>
    </aside>
    <section id="stage">
      <div id="pages-scroll"><div id="pages" class="pdfViewer"></div></div>
      <div id="empty"></div>
    </section>
    <aside id="right" class="column">
      <nav class="tabs" id="right-tabs"></nav>
      <div class="column-body" id="right-body"></div>
    </aside>
  </main>
  <div id="popup" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
